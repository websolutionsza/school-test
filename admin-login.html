<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenwood High School | Admin Login</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/websolutionsza/school-test/refs/heads/main/school%20test%20logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #172554;
      --primary-light: #eff6ff;
      --accent: #b45309;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #166534;
      --success-bg: #f0fdf4;
      --text-dark: #111827;
      --text-medium: #4b5563;
      --text-light: #9ca3af;
      --bg-white: #ffffff;
      --bg-light: #f8fafc;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-head: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      color: var(--text-dark);
      background: var(--bg-light);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* HEADER */
    .auth-header {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      box-shadow: var(--shadow-sm);
    }
    .auth-header .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.45rem;
      color: var(--primary);
      max-width: 1200px;
      margin: 0 auto;
      letter-spacing: -0.5px;
    }
    .auth-header .logo img {
      height: 75px;
      width: auto;
      object-fit: contain;
    }

    /* MAIN */
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--primary-dark);
      position: relative;
      overflow: hidden;
    }
    .auth-main::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(23, 37, 84, 0.85), rgba(23, 37, 84, 0.95)),
                  url('https://raw.githubusercontent.com/websolutionsza/school-test/refs/heads/main/back%20photo%20test%20school.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(4px);
      transform: scale(1.05);
      z-index: -1;
    }

    .login-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 48px 40px;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .login-icon svg { width: 28px; height: 28px; }

    .login-card h1 {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
      color: var(--text-dark);
    }
    .login-card .subtitle {
      font-size: 0.95rem;
      color: var(--text-medium);
      margin-bottom: 32px;
      text-align: center;
    }

    /* FORM */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .input-wrapper .input-icon svg { width: 20px; height: 20px; }

    .form-group input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-dark);
      background: var(--bg-white);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }
    .form-group input:disabled {
      background: var(--bg-light);
      cursor: not-allowed;
    }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-light);
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover { color: var(--primary); }
    .password-toggle svg { width: 20px; height: 20px; }

    /* BUTTON */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: var(--primary);
      color: #fff;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) {
      background: var(--primary-dark);
      box-shadow: var(--shadow-md);
    }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; }

    /* MESSAGES */
    .message {
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.9rem;
      margin-bottom: 24px;
      display: none;
      align-items: flex-start;
      gap: 10px;
      font-weight: 500;
    }
    .message.show { display: flex; }
    .message svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
    .message.error {
      background: var(--danger-bg);
      border: 1px solid #fecaca;
      color: var(--danger);
    }
    .message.success {
      background: var(--success-bg);
      border: 1px solid #bbf7d0;
      color: var(--success);
    }

    /* LINKS */
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--text-medium);
      font-weight: 600;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--primary); }
    .back-link svg { width: 16px; height: 16px; }

    /* SPINNER */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .auth-header .logo img { height: 55px; }
      .auth-header .logo { font-size: 1.15rem; gap: 10px; }
      .login-card { padding: 36px 28px; }
      .login-card h1 { font-size: 1.4rem; }
      .auth-main { padding: 24px 16px; }
    }
  </style>
</head>
<body>

  <header class="auth-header">
    <a href="index.html" class="logo">
      <img src="https://raw.githubusercontent.com/websolutionsza/school-test/refs/heads/main/school%20test%20logo.png" alt="Greenwood High School Logo">
      <span>Greenwood High — Admin</span>
    </a>
  </header>

  <main class="auth-main">
    <div class="login-card">
      <div class="login-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>Administration Portal</h1>
      <p class="subtitle">Secure access for school administrators only.</p>

      <div id="messageBox" class="message"></div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" name="email" placeholder="principal@greenwoodhigh.edu" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn">Sign In</button>
      </form>

      <a href="index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to school website
      </a>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/postbasejs/+esm';

    const postbase = createClient(
      'https://postbase-production-b4c8.up.railway.app',
      'pb_anon_fsq2eoaBVsA3NcKwKJnp7iH4TEb-ZoUOzSSVsbwhbFT26sOrKq1zSE94esDhwIy1',
      { projectId: 'ea6357bc-c34f-4dc2-b0ef-470facb6d9bb' }
    );

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const messageBox = document.getElementById('messageBox');

    // Password visibility toggle (frontend only, does not affect auth)
    const togglePassword = document.getElementById('togglePassword');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      eyeOpen.style.display = type === 'password' ? 'block' : 'none';
      eyeClosed.style.display = type === 'password' ? 'none' : 'block';
    });

    const icons = {
      error: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
      success: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
    };

    function showMessage(text, type) {
      const icon = type === 'error' ? icons.error : icons.success;
      messageBox.innerHTML = `${icon}<span>${text}</span>`;
      messageBox.className = 'message show ' + type;
    }
    function hideMessage() {
      messageBox.className = 'message';
      messageBox.innerHTML = '';
    }

    // If this tab already authenticated AND a PostBase session exists, skip the form.
    // Otherwise, always show the login form — this enforces re-login on a fresh tab.
    (async function checkSession() {
      const tabAuthed = sessionStorage.getItem('admin_tab_authenticated') === 'true';
      if (!tabAuthed) return;

      const { data } = await postbase.auth.getSession();
      if (data && data.session) {
        window.location.replace('administration.html');
      } else {
        sessionStorage.removeItem('admin_tab_authenticated');
      }
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage('Please enter both your email and password.', 'error');
        return;
      }

      loginBtn.disabled = true;
      emailInput.disabled = true;
      passwordInput.disabled = true;
      togglePassword.disabled = true;
      loginBtn.innerHTML = '<span class="spinner"></span> Signing in…';

      const { data, error } = await postbase.auth.signInWithPassword({
        email,
        password,
        rememberMe: true
      });

      if (error) {
        loginBtn.disabled = false;
        emailInput.disabled = false;
        passwordInput.disabled = false;
        togglePassword.disabled = false;
        loginBtn.textContent = 'Sign In';

        const msg = (error.message || '').toLowerCase();
        if (msg.includes('invalid') || msg.includes('credentials') || msg.includes('password')) {
          showMessage('Incorrect email or password. Please try again.', 'error');
        } else if (msg.includes('not found') || msg.includes('no user')) {
          showMessage('No account found with that email address.', 'error');
        } else {
          showMessage('Login failed: ' + (error.message || 'unknown error'), 'error');
        }
        return;
      }

      sessionStorage.setItem('admin_tab_authenticated', 'true');

      showMessage('Login successful. Redirecting…', 'success');
      window.location.replace('administration.html');
    });

    [emailInput, passwordInput].forEach(input => {
      input.addEventListener('input', hideMessage);
    });
  </script>

</body>
</html>
