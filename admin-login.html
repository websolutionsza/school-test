<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Login | Greenwood High School</title>
  <meta name="description" content="Secure administration portal for Greenwood High School staff.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/websolutionsza/school-test/refs/heads/main/school%20test%20logo.png">

  <script>
    (function () {
      try {
        var t = localStorage.getItem("ghs:theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/qol.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="index.html" class="brand">
      <img src="https://raw.githubusercontent.com/websolutionsza/school-test/refs/heads/main/school%20test%20logo.png" alt="">
      <span class="brand-text">
        <span class="brand-name">Greenwood High</span>
        <span class="brand-tag">Admin Portal</span>
      </span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h1>Administration Portal</h1>
      <p class="auth-subtitle">Secure access for school administrators only.</p>

      <div id="messageBox" class="auth-message" role="alert" aria-live="assertive"></div>

      <form id="loginForm" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input class="input" type="email" id="email" name="email" placeholder="principal@greenwoodhigh.edu" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input class="input" type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" id="togglePassword" class="input-action" aria-label="Toggle password visibility">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg">Sign In</button>
      </form>

      <a href="index.html" class="auth-back">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to school website
      </a>
    </div>
  </main>

  <script type="module" src="assets/js/config.js"></script>
  <script type="module">
    import { initThemeToggle } from "./assets/js/theme.js";
    import { initAdminLogin } from "./assets/js/admin-auth.js";

    initThemeToggle();
    initAdminLogin();
  </script>
</body>
</html>
